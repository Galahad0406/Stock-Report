name: Monthly Stock Report Data Update

on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-report-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'Stock-Report/1.0 (contact@example.com)' }}
      OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (fallback if lockfile missing)
        run: |
          npm ci || npm install --no-audit --prefer-offline

      - name: Run data update
        run: npm run update-data

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "chore: automated SEC 13F data update"
          git push
