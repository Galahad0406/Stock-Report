name: Monthly Stock Report Data Update

on:
  workflow_dispatch:

  schedule:
    - cron: "17 8 1 * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update SEC 13F and news data
        run: npm run update-data

      - name: Check generated data
        run: |
          test -f public/data/latest.json
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('public/data/latest.json','utf8')); console.log('Generated:', d.generatedAt); console.log('Quarter:', d.sourceQuarter); console.log('Holdings:', d.holdings?.length || 0);"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/latest.json

          if git diff --cached --quiet; then
            echo "No data changes detected."
          else
            git commit -m "Update stock report data"
            git push
          fi
