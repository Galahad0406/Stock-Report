name: Monthly 13F Report Update

on:
  schedule:
    - cron: '0 0 1 * *' # 매월 1일 00:00 UTC 실행
  workflow_dispatch: # GitHub 웹에서 버튼을 눌러 수동으로도 실행 가능

jobs:
  update-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SEC 13F Parser & AI Analyzer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EDGAR_IDENTITY: "My13FApp report-bot@example.com" # 본인의 이름이나 앱 이름 및 이메일로 변경하세요
        run: python scripts/fetch_13f.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update monthly SEC 13F investment report"
          branch: main
