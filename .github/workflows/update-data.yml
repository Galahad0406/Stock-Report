name: Update Stock Data

on:
  schedule:
    # 매일 한국 시간 기준 아침 9시 (UTC 기준 0시) 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 생성

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run update script
        run: node scripts/update-data.mjs

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/latest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update stock data [skip ci]" && git push)
